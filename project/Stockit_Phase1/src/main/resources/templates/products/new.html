<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stockit | Inventory</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/site.css}" rel="stylesheet"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container pb-5"><div class="row justify-content-center"><div class="col-lg-8"><div class="card p-4 p-md-5"><h1 class="h2 mb-1">Add a product</h1><p class="text-muted">Fields marked * are required.</p><form th:action="@{/products}" th:object="${product}" method="post" novalidate><div class="row g-3"><div class="col-md-7"><label for="name" class="form-label">Product name *</label><input id="name" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" th:field="*{name}" maxlength="100" required><div class="invalid-feedback" th:errors="*{name}"></div></div><div class="col-md-5"><label for="sku" class="form-label">SKU *</label><input id="sku" class="form-control" th:classappend="${#fields.hasErrors('sku')} ? 'is-invalid'" th:field="*{sku}" maxlength="30" required><div class="invalid-feedback" th:errors="*{sku}"></div></div><div class="col-md-6"><label for="category" class="form-label">Category *</label><select id="category" class="form-select" th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'" th:field="*{category}" required><option value="">Choose a category</option><option th:each="c:${categories}" th:value="${c}" th:text="${#strings.replace(c.name(),'_',' ')}"></option></select><div class="invalid-feedback" th:errors="*{category}"></div></div><div class="col-md-6"><label for="supplier" class="form-label">Supplier *</label><input id="supplier" class="form-control" th:classappend="${#fields.hasErrors('supplier')} ? 'is-invalid'" th:field="*{supplier}" maxlength="80" required><div class="invalid-feedback" th:errors="*{supplier}"></div></div><div class="col-md-4"><label for="quantity" class="form-label">Quantity *</label><input id="quantity" type="number" min="0" max="100000" class="form-control" th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'" th:field="*{quantity}" required><div class="invalid-feedback" th:errors="*{quantity}"></div></div><div class="col-md-4"><label for="price" class="form-label">Unit price ($) *</label><input id="price" type="number" min="0.01" max="1000000" step="0.01" class="form-control" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'" th:field="*{price}" required><div class="invalid-feedback" th:errors="*{price}"></div></div><div class="col-md-4"><label for="reorderLevel" class="form-label">Reorder level *</label><input id="reorderLevel" type="number" min="0" max="100000" class="form-control" th:classappend="${#fields.hasErrors('reorderLevel')} ? 'is-invalid'" th:field="*{reorderLevel}" required><div class="invalid-feedback" th:errors="*{reorderLevel}"></div></div></div><div class="mt-4 d-flex gap-2"><button class="btn btn-primary" type="submit">Save product</button><a class="btn btn-outline-secondary" th:href="@{/products}">Cancel</a></div></form></div></div></div></main><footer class="container footer border-top py-3">Stockit · CPAN-228 Phase 1 · Inventory Management System</footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
