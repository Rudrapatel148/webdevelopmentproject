<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stockit | Inventory</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/site.css}" rel="stylesheet"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container pb-5"><div class="d-flex justify-content-between align-items-center mb-3"><div><h1 class="h2 mb-1">Inventory</h1><p class="text-muted mb-0">Browse and manage product records</p></div><a class="btn btn-primary" th:href="@{/products/new}">+ Add Product</a></div><div class="card p-3 mb-4"><form method="get" th:action="@{/products}" class="row g-3 align-items-end"><div class="col-md-3"><label class="form-label" for="category">Category</label><select id="category" name="category" class="form-select"><option value="">All categories</option><option th:each="c:${categories}" th:value="${c}" th:selected="${selectedCategory == c}" th:text="${#strings.replace(c.name(),'_',' ')}"></option></select></div><div class="col-md-3"><label class="form-label" for="stock">Stock status</label><select id="stock" name="stock" class="form-select"><option value="">All stock</option><option value="LOW" th:selected="${stock == 'LOW'}">Low stock</option><option value="OK" th:selected="${stock == 'OK'}">In stock</option></select></div><div class="col-md-2"><label class="form-label" for="sort">Sort by</label><select id="sort" name="sort" class="form-select"><option th:each="field:${{'name','price','quantity','createdAt'}}" th:value="${field}" th:selected="${sort == field}" th:text="${field == 'createdAt' ? 'Date added' : #strings.capitalize(field)}"></option></select></div><div class="col-md-2"><label class="form-label" for="direction">Direction</label><select id="direction" name="direction" class="form-select"><option value="asc" th:selected="${direction == 'asc'}">Ascending</option><option value="desc" th:selected="${direction == 'desc'}">Descending</option></select></div><div class="col-md-2"><button class="btn btn-primary w-100">Apply</button></div></form></div><div class="card overflow-hidden"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Product</th><th>SKU</th><th>Category</th><th>Quantity</th><th>Price</th><th>Stock</th></tr></thead><tbody><tr th:each="p:${products.content}"><td><a class="fw-semibold text-decoration-none" th:href="@{/products/{id}(id=${p.id})}" th:text="${p.name}"></a></td><td th:text="${p.sku}"></td><td th:text="${#strings.replace(p.category.name(),'_',' ')}"></td><td th:text="${p.quantity}"></td><td th:text="|$${p.price}|"></td><td><span class="badge bg-warning text-dark" th:if="${p.lowStock}">Low stock</span><span class="badge bg-success" th:unless="${p.lowStock}">In stock</span></td></tr><tr th:if="${products.empty}"><td colspan="6" class="text-center py-5">No products match these filters.</td></tr></tbody></table></div></div><div class="d-flex justify-content-between align-items-center mt-3"><p class="text-muted mb-0" th:text="|${products.totalElements} matching products · Page ${products.number + 1} of ${products.totalPages == 0 ? 1 : products.totalPages}|"></p><nav aria-label="Pagination"><div class="btn-group"><a class="btn btn-outline-primary" th:classappend="${products.first} ? 'disabled'" th:href="@{/products(page=${products.number-1},category=${selectedCategory},stock=${stock},sort=${sort},direction=${direction})}">Previous</a><a class="btn btn-outline-primary" th:classappend="${products.last} ? 'disabled'" th:href="@{/products(page=${products.number+1},category=${selectedCategory},stock=${stock},sort=${sort},direction=${direction})}">Next</a></div></nav></div></main><footer class="container footer border-top py-3">Stockit · CPAN-228 Phase 1 · Inventory Management System</footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
