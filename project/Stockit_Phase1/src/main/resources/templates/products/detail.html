<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stockit | Inventory</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/site.css}" rel="stylesheet"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container pb-5"><div class="row justify-content-center"><div class="col-lg-8"><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="card p-4 p-md-5"><p class="text-muted mb-1">Product record</p><h1 th:text="${product.name}">Product</h1><p><span class="badge bg-warning text-dark" th:if="${product.lowStock}">Low stock</span><span class="badge bg-success" th:unless="${product.lowStock}">In stock</span></p><dl class="row"><dt class="col-sm-4">SKU</dt><dd class="col-sm-8" th:text="${product.sku}"></dd><dt class="col-sm-4">Category</dt><dd class="col-sm-8" th:text="${#strings.replace(product.category.name(),'_',' ')}"></dd><dt class="col-sm-4">Quantity</dt><dd class="col-sm-8" th:text="${product.quantity}"></dd><dt class="col-sm-4">Unit price</dt><dd class="col-sm-8" th:text="|$${product.price}|"></dd><dt class="col-sm-4">Reorder level</dt><dd class="col-sm-8" th:text="${product.reorderLevel}"></dd><dt class="col-sm-4">Supplier</dt><dd class="col-sm-8" th:text="${product.supplier}"></dd><dt class="col-sm-4">Created</dt><dd class="col-sm-8" th:text="${#temporals.format(product.createdAt,'MMM d, yyyy h:mm a')}"></dd></dl><a class="btn btn-primary" th:href="@{/products}">Back to inventory</a></div></div></div></main><footer class="container footer border-top py-3">Stockit · CPAN-228 Phase 1 · Inventory Management System</footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
